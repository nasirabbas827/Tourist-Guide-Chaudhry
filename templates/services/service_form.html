{% extends "base.html" %}
{% block content %}
<div class="container">
    <h2>{{ action }} Third Party Service</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">{{ action }}</button>
        <a href="{% url 'service_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
