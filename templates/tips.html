{% extends "base.html" %}
{% block content %}

<section class="tips">
    <div class="container">
        <h2 class="section-title">Travel Tips</h2>
        <ul class="tips-list">
            {% for t in tips %}
                <li>
                    <strong>{{ t.title }}:</strong> {{ t.description }}

                    <!-- Social Share Icons -->
                    <span class="social-share" style="margin-left:10px;">
                        <a href="https://www.facebook.com/sharer/sharer.php?u={{ request.build_absolute_uri }}" target="_blank" title="Share on Facebook">
                            <i class="fab fa-facebook"></i>
                        </a>
                        <a href="https://twitter.com/intent/tweet?text={{ t.title|urlencode }}&url={{ request.build_absolute_uri }}" target="_blank" title="Share on Twitter">
                            <i class="fab fa-twitter"></i>
                        </a>
                        <a href="https://www.linkedin.com/shareArticle?mini=true&url={{ request.build_absolute_uri }}&title={{ t.title|urlencode }}" target="_blank" title="Share on LinkedIn">
                            <i class="fab fa-linkedin"></i>
                        </a>
                    </span>
                </li>
            {% empty %}
                <li>No travel tips available.</li>
            {% endfor %}
        </ul>
    </div>
</section>


{% endblock %}
